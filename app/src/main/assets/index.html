<style>
/* Layout: one-column phone app — sticky day header, scrolling body, fixed bottom tab bar. Exercise-book ink + highlighter. */
:root{
  --paper:#f3f5f7; --sheet:#ffffff; --ink:#1d2a44; --muted:#5d6a80; --rule:#dde3ea;
  --pen:#2a4fb5; --pen-soft:#e5ecfb; --marker:#f2b705; --marker-soft:#fff3c4;
  --good:#1f8a5b; --good-soft:#dcf2e7; --late:#c2410c; --late-soft:#fde7dc;
  --display:"Baloo Da 2","Hind Siliguri",system-ui,sans-serif;
  --body:"Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1522; --sheet:#172033; --ink:#e6ebf5; --muted:#9aa6bd; --rule:#2a3550;
  --pen:#8fb0ff; --pen-soft:#22305a; --marker:#f5c542; --marker-soft:#3a3214;
  --good:#4fd39a; --good-soft:#163a2b; --late:#ff9a6b; --late-soft:#3d2216; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1522; --sheet:#172033; --ink:#e6ebf5; --muted:#9aa6bd; --rule:#2a3550;
  --pen:#8fb0ff; --pen-soft:#22305a; --marker:#f5c542; --marker-soft:#3a3214;
  --good:#4fd39a; --good-soft:#163a2b; --late:#ff9a6b; --late-soft:#3d2216; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--pen)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--pen);color:#fff}
header.top .wrap{padding-block:14px 16px;display:flex;align-items:center;gap:14px}
.daynum{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;min-width:64px}
.daynum small{display:block;font-size:12px;font-family:var(--body);font-weight:500;opacity:.8;letter-spacing:.04em}
.hmeta{flex:1;min-width:0}
.hmeta h1{font-family:var(--display);font-size:19px;margin:0;font-weight:700;text-wrap:balance}
.hmeta p{margin:0;font-size:13px;opacity:.85}
.ring{width:54px;height:54px;flex:none}
.ring circle{fill:none;stroke-width:6}
.ring text{fill:#fff;font-size:13px;font-weight:600;font-family:var(--body)}
main .wrap{padding-block:16px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--display);font-size:18px;margin:0 0 8px;font-weight:700;display:flex;align-items:center;gap:8px}
h2 .tag{font-family:var(--body);font-size:12px;font-weight:600;padding:1px 9px;border-radius:99px;background:var(--marker-soft);color:var(--ink)}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--rule)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:88px}
.check{appearance:none;width:24px;height:24px;border:2px solid var(--muted);border-radius:7px;flex:none;cursor:pointer;display:grid;place-content:center;background:transparent;margin:0}
.check:checked{background:var(--good);border-color:var(--good)}
.check:checked::after{content:"";width:10px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.check:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--marker);outline-offset:2px}
.done .label{text-decoration:line-through;color:var(--muted)}
.sub{font-size:12px;color:var(--muted)}
.chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.chip.p1{background:var(--pen-soft);color:var(--pen)}
.chip.p2{background:var(--marker-soft);color:var(--ink)}
.chip.p3{background:var(--good-soft);color:var(--good)}
.chip.late{background:var(--late-soft);color:var(--late)}
.empty{padding:16px;color:var(--muted);font-size:14px}
.bar{height:6px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen);border-radius:99px}
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.phase{padding:10px;border-radius:10px;background:var(--sheet);border:1px solid var(--rule);font-size:12px}
.phase b{display:block;font-family:var(--display);font-size:15px}
.phase.now{border-color:var(--pen);box-shadow:inset 0 0 0 1px var(--pen)}
/* Checklist */
details.subj{background:var(--sheet);border:1px solid var(--rule);border-radius:12px}
details.subj+details.subj{margin-top:10px}
details.subj summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
details.subj summary::-webkit-details-marker{display:none}
.sumtop{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sumtop b{font-family:var(--display);font-size:16px}
.chrow{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--rule)}
.chrow input.name{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;padding:4px 0}
.tog{border:1.5px solid var(--rule);background:transparent;color:var(--muted);border-radius:8px;font:inherit;font-size:12px;font-weight:600;padding:3px 7px;cursor:pointer;min-width:42px}
.tog.on{background:var(--good);border-color:var(--good);color:#fff}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
.addrow{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--rule)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
/* Forms */
.field{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-top:1px solid var(--rule)}
.field:first-child{border-top:0}
.field label{font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=date],input[type=number],input[type=time],select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:90px;font-size:12px;font-family:ui-monospace,monospace}
.btn{font:inherit;font-weight:600;border-radius:9px;padding:9px 14px;border:0;cursor:pointer;background:var(--pen);color:#fff;white-space:nowrap}
.btn.ghost{background:var(--pen-soft);color:var(--pen)}
.btn.warn{background:var(--late-soft);color:var(--late)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.rrow{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;padding:8px 14px;border-top:1px solid var(--rule)}
.subjpick{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;padding:12px 14px}
.subjpick label{display:flex;gap:8px;align-items:center;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:9px;overflow:hidden}
.seg button{font:inherit;font-size:13px;padding:6px 12px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--pen);color:#fff}
/* Plan */
.prow{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:10px 14px;border-top:1px solid var(--rule)}
.prow.today{background:var(--marker-soft)}
.prow .d{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.1}
.prow .d span{display:block;font-family:var(--body);font-size:11px;font-weight:500;color:var(--muted)}
.tasks{display:flex;flex-direction:column;gap:2px;font-size:14px;min-width:0}
.tasks .ok{color:var(--good)}
/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{font:inherit;font-size:12px;font-weight:600;background:none;border:0;color:var(--muted);padding:9px 0 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--pen)}
.modal{position:fixed;inset:0;background:rgba(10,15,30,.5);z-index:20;display:grid;place-items:center;padding:16px}
.modal .box{background:var(--sheet);border-radius:14px;padding:18px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:99px;font-size:13px;z-index:30}
.hint{margin:-4px 0 8px;font-size:13px;color:var(--muted)}
.note{background:var(--marker-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.note ul{margin:6px 0 0;padding-left:18px}
.bar-row{display:block}.bar-top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.phase-h{margin:18px 0 8px;font-size:15px}.phase-h:first-child{margin-top:0}
details.subj.cur{border-color:var(--pen);box-shadow:inset 0 0 0 1px var(--pen)}
.chrow .done .label{text-decoration:line-through;color:var(--muted)}
.addrow select{width:auto;max-width:40%}
.planseg{margin-bottom:12px}
.sheet.day+.sheet.day{margin-top:8px}
.sheet.day.cur{border-color:var(--pen);box-shadow:inset 0 0 0 1px var(--pen)}
.dayhead{display:flex;align-items:baseline;gap:10px;padding:10px 14px 8px;background:var(--pen-soft)}
.dayhead b{font-family:var(--display);font-size:16px}
.dayhead .sub{flex:1}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>

/* ---------- calendar ---------- */
function cal(){
  const total=Math.max(diff(S.start,S.end)+1,7*S.weeks.length);
  const N=S.weeks.length;
  // weeks are 7 days each; the last week stretches to the end date
  const ws=S.weeks.map((_,i)=>{const a=addDays(S.start,i*7);const b=i===N-1?S.end:addDays(S.start,i*7+6);return{a,b}});
  const today=iso(new Date());const di=diff(S.start,today);
  let wi=-1;if(di>=0){wi=Math.min(Math.floor(di/7),N-1);if(diff(today,ws[N-1].b)<0)wi=N;}
  return{total,ws,di,wi,today};
}

function spread(items,D,out){const n=items.length;items.forEach((x,i)=>{const a=Math.floor(i*D/n);const b=Math.max(a,Math.floor((i+1)*D/n)-1);
  for(let d=a;d<=b;d++)out[d].push({x,part:d-a+1,of:b-a+1})})}
function dayPlan(C,wi){const D=diff(C.ws[wi].a,C.ws[wi].b)+1;const out=Array.from({length:D},()=>[]);const w=S.weeks[wi];
  const order=(a,b)=>b.hard-a.hard;
  spread(w.filter(x=>!LANG.includes(x.s)).sort(order),D,out);spread(w.filter(x=>LANG.includes(x.s)),D,out);return out}
const partLabel=p=>p.of>1?(S.lang==='bn'?`${num(p.of)} দিনের ${num(p.part)} নং দিন`:`day ${p.part} of ${p.of}`):'';

function overall(){let n=0,d=0;allTopics().forEach(x=>{n+=2;d+=(x.read?1:0)+(x.rev?1:0)});return n?d/n:0}
function findT(tid){for(const w of S.weeks)for(const x of w)if(x.id===tid)return x}
function streak(){const n=S.routine.length;if(!n)return 0;let k=0,day=iso(new Date());
  const ok=dd=>((S.log[dd]||[]).filter(x=>S.routine.some(r=>r.id===x)).length)>=Math.ceil(n/2);

    if(ph!==lastPh){html+=`<h2 class="phase-h"><span class="chip p${ph}">${t('p'+ph)}</span><span class="sub">${t('p'+ph+'s')}</span></h2>`;lastPh=ph}
    const d=w.filter(x=>x.read).length;const cur=i===C.wi;
    html+=`<details class="subj ${cur?'cur':''}" data-w="${i}" ${open.has(i)?'open':''}><summary><div class="sumtop"><b>${t('week')} ${num(i+1)}${cur?' · '+t('today'):''}</b><span class="sub">${fmt(C.ws[i].a)} – ${fmt(C.ws[i].b)} · ${num(d)}/${num(w.length)}</span></div><div class="bar"><i style="width:${w.length?d/w.length*100:0}%"></i></div></summary>
      ${w.map(x=>`<div class="chrow"><input type="checkbox" class="check" data-t="${x.id}" ${x.read?'checked':''} aria-label="${t('read')}"><span class="grow ${x.read?'done':''}"><span class="label">${esc(x.t)}</span><div class="sub">${sn(x.s)}${x.hard?' · '+t('hard'):''}${x.added?' · '+t('added'):''}</div></span><button class="x" data-del="${x.id}" data-w="${i}" aria-label="${t('del')}">×</button></div>`).join('')}
      <div class="addrow"><select id="as-${i}" aria-label="subject">${opts}</select><input type="text" id="at-${i}" placeholder="${t('addTopic')}"><button class="btn ghost" data-add="${i}">${t('add')}</button></div></details>`});
  html+=`<section class="note"><b>${t('guide')}</b><ul>${GUIDE.map(g=>`<li>${g}</li>`).join('')}</ul></section>`;
  view.innerHTML=`<section>${seg}${html}</section>`;bindSeg();
  view.querySelectorAll('details.subj').forEach(d=>d.ontoggle=()=>{const i=+d.dataset.w;d.open?open.add(i):open.delete(i)});
  bindTopicChecks();
  view.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const w=S.weeks[+b.dataset.w];const x=findT(b.dataset.del);
    ask('"'+x.t+'"',()=>{S.weeks[+b.dataset.w]=w.filter(y=>y.id!==x.id);save();render()})});
  view.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const i=+b.dataset.add;const v=document.getElementById('at-'+i).value.trim();if(!v)return;
    S.weeks[i].push({id:id(),s:document.getElementById('as-'+i).value,t:v,hard:false,added:true,read:false,rev:false});save();render()});
}
function vCheck(){
  const open=vCheck.open||(vCheck.open=new Set());
  const by={};S.weeks.forEach((w,i)=>w.forEach(x=>{if(x.s!=='all')(by[x.s]=by[x.s]||[]).push([x,i+1])}));
  const html=Object.keys(SUBJ).filter(k=>by[k]).map(k=>{const list=by[k];const r=list.filter(([x])=>x.read).length;const v=list.filter(([x])=>x.rev).length;
    const p=Math.round((r+v)/(list.length*2)*100);
    return`<details class="subj" data-s="${k}" ${open.has(k)?'open':''}><summary><div class="sumtop"><b>${sn(k)}</b><span class="sub">${t('read')} ${num(r)}/${num(list.length)} · ${t('rev')} ${num(v)} · ${num(p)}%</span></div><div class="bar"><i style="width:${p}%"></i></div></summary>
     ${list.map(([x,w])=>`<div class="chrow"><span class="grow"><span class="label">${esc(x.t)}</span><div class="sub">${t('week')} ${num(w)}${x.hard?' · '+t('hard'):''}</div></span>${['read','rev'].map(f=>`<button class="tog ${x[f]?'on':''}" data-c="${x.id}" data-f="${f}">${t(f)}</button>`).join('')}</div>`).join('')}</details>`}).join('');
  view.innerHTML=`<section>${html}</section>`;
  view.querySelectorAll('details.subj').forEach(d=>d.ontoggle=()=>{d.open?open.add(d.dataset.s):open.delete(d.dataset.s)});
  view.querySelectorAll('.tog').forEach(b=>b.onclick=()=>{const x=findT(b.dataset.c);x[b.dataset.f]=!x[b.dataset.f];save();render()});
}
function vSettings(){
  const rr=S.routine.map(r=>`<div class="rrow"><input type="time" id="rt-${r.id}" data-rt="${r.id}" value="${esc(r.time)}"><input type="text" id="rx-${r.id}" data-rx="${r.id}" value="${esc(r.task)}"><button class="x" data-rdel="${r.id}" aria-label="${t('del')}">×</button></div>`).join('');
  const seg=(key,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button data-set-${key}="${v}" class="${S[key]===v?'on':''}">${l}</button>`).join('')}</div>`;
  view.innerHTML=`
  <section><div class="sheet">
    <div class="field"><label>${t('lang')}</label>${seg('lang',[['bn','বাংলা'],['en','English']])}</div>
    <div class="field"><label>${t('theme')}</label>${seg('theme',[['auto',t('auto')],['light',t('light')],['dark',t('dark')]])}</div>
    <div class="field"><label for="sName">${t('name')}</label><input type="text" id="sName" value="${esc(S.name)}"></div>
    <div class="field"><label for="sStart">${t('start')}</label><input type="date" id="sStart" value="${S.start}"></div>
    <div class="field"><label for="sEnd">${t('end')}</label><input type="date" id="sEnd" value="${S.end}"></div>
  </div></section>
  <section><h2>${t('editRoutine')}</h2><div class="sheet">${rr}<div class="addrow"><button class="btn ghost" id="rAdd">${t('addSlot')}</button></div></div></section>
  <section><h2>${t('backup')}</h2><div class="sheet"><div class="field"><label for="bk">${t('backupHint')}</label><textarea id="bk"></textarea><div class="btns"><button class="btn ghost" id="bCopy">${t('copy')}</button><button class="btn" id="bRestore">${t('restore')}</button></div></div></div></section>
  <section><button class="btn warn" id="reset">${t('reset')}</button></section>`;
  const $=i=>document.getElementById(i);
  $('bk').value=JSON.stringify(S);
  view.querySelectorAll('[data-set-lang]').forEach(b=>b.onclick=()=>{S.lang=b.dataset.setLang;save();render()});
  view.querySelectorAll('[data-set-theme]').forEach(b=>b.onclick=()=>{S.theme=b.dataset.setTheme;save();applyTheme();render()});
  $('sName').onchange=()=>{S.name=$('sName').value.trim();save();render()};
  $('sStart').onchange=()=>{if($('sStart').value){S.start=$('sStart').value;save();render()}};
  $('sEnd').onchange=()=>{if($('sEnd').value){S.end=$('sEnd').value;save();render()}};
  view.querySelectorAll('[data-rt]').forEach(i=>i.onchange=()=>{S.routine.find(x=>x.id===i.dataset.rt).time=i.value;S.routine.sort((a,b)=>a.time.localeCompare(b.time));save();render()});
  view.querySelectorAll('[data-rx]').forEach(i=>i.onchange=()=>{S.routine.find(x=>x.id===i.dataset.rx).task=i.value;save()});
  view.querySelectorAll('[data-rdel]').forEach(b=>b.onclick=()=>{S.routine=S.routine.filter(x=>x.id!==b.dataset.rdel);save();render()});
  $('rAdd').onclick=()=>{S.routine.push({id:id(),time:'12:00',task:'…'});S.routine.sort((a,b)=>a.time.localeCompare(b.time));save();render()};
  $('bCopy').onclick=()=>{const ta=$('bk');const done=()=>toast(t('copied'));const fb=()=>{ta.select();try{document.execCommand('copy')}catch(e){}done()};
    try{navigator.clipboard.writeText(ta.value).then(done,fb)}catch(e){fb()}};
  $('bRestore').onclick=()=>{try{const v=JSON.parse($('bk').value);if(!v.weeks||!v.routine)throw 0;S=v;save();applyTheme();toast(t('restored'));render()}catch(e){toast(t('bad'))}};
  $('reset').onclick=()=>ask(t('resetWarn'),()=>{const l=S.lang;S=fresh();S.lang=l;save();applyTheme();render()});
}

function render(){
  document.documentElement.lang=S.lang;
  const C=cal();header(C);
  document.getElementById('tabs').innerHTML=['today','plan','check','settings'].map(k=>`<button data-tab="${k}" class="${S.tab===k?'on':''}"><svg viewBox="0 0 24 24">${ICONS[k]}</svg>${t(k)}</button>`).join('');
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;vPlan.scrolled=0;save();render();window.scrollTo(0,0)});
  ({today:vToday,plan:vPlan,check:vCheck,settings:vSettings}[S.tab]||vToday)(C);
}
applyTheme();render();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
})();
</script>

</html>
